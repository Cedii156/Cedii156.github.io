<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#151a21">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Trueline Plan</title>
<meta name="description" content="Raum- und Elektropläne schnell auf dem Tablet zeichnen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#0f1318;--bar:#161b22;--bar2:#202833;--line:#2a3340;--txt:#e8edf3;--mut:#8d99a8;--acc:#f6b400;--danger:#ff6b6b;--in:#0d1116}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer}
#app{display:grid;grid-template-columns:78px 1fr auto;grid-template-rows:54px 1fr;height:100%;height:100dvh}
#top{grid-column:1/-1;display:flex;align-items:center;gap:2px;padding:0 8px;padding-left:max(8px,env(safe-area-inset-left));background:var(--bar);border-bottom:1px solid var(--line)}
.ib{height:42px;min-width:42px;border-radius:10px;border:0;background:transparent;color:var(--txt);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:14px;font-weight:600}
.ib:active,.ib:hover{background:var(--bar2)}
.ib svg{width:22px;height:22px;flex:none}
.ib:disabled{opacity:.35}
#pname{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;cursor:pointer}
#pname small{font-weight:500;color:var(--mut);font-size:12px;margin-left:8px}
#tools{background:var(--bar);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:8px 7px;overflow:auto}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;border-radius:12px;border:0;background:transparent;color:var(--mut);font-size:11px;font-weight:700;letter-spacing:.2px}
.tb svg{width:26px;height:26px}
.tb.on{background:var(--acc);color:#14181d}
#stage{position:relative;overflow:hidden;background:#fbfaf6;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#panel{width:330px;background:var(--bar);border-left:1px solid var(--line);overflow:auto;display:none;padding:12px 14px 30px;-webkit-user-select:text;user-select:text}
#panel.open{display:block}
.phd{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 6px}
.phd b{font-size:17px}
.sec{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px}
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;height:42px;background:var(--in);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:0 12px;font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
textarea{height:80px;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
input[type=range]{padding:0;accent-color:var(--acc)}
.ig{display:flex;align-items:center;gap:8px}.ig em{color:var(--mut);font-style:normal;font-size:14px;min-width:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--in);color:var(--txt);border-radius:999px;padding:8px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center}
.chip.on{background:var(--acc);color:#14181d;border-color:var(--acc)}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;flex:none}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.pi{background:#fbfaf6;border-radius:10px;border:2px solid transparent;padding:6px 3px 7px;color:#1b2a49;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;line-height:1.15}
.pi svg{width:44px;height:44px}
.pi.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.btn{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bar2);color:var(--txt);padding:0 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--acc);color:#14181d;border-color:var(--acc)}
.btn.dan{color:var(--danger)}
.btn svg{width:18px;height:18px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv b{font-variant-numeric:tabular-nums}
.edge{display:grid;grid-template-columns:34px 1fr 20px;align-items:center;gap:6px;margin:6px 0}
.edge i{font-style:normal;color:var(--mut);font-size:13px;font-weight:700}
.cinf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(246,180,0,.12);border:1px solid rgba(246,180,0,.4);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}
.cinf b{color:var(--acc)}.cinf .btn{height:32px;padding:0 10px;font-size:12px;margin-left:auto}
.cinf.off{background:var(--in);border-color:var(--line);color:var(--mut);font-size:13px}
.crow{background:var(--in);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.crow .ch{display:flex;align-items:center;gap:10px}.crow .cid{font-weight:800;color:var(--acc);font-size:16px;min-width:48px}
.crow .ct{flex:1;min-width:0}.crow .ct b{display:block}.crow .ct small{color:var(--mut);display:block}
.crow .cf{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:8px}.crow .cf input{height:38px;font-size:14px}
.crow .btn{height:36px;font-size:13px}
#floors{position:absolute;left:10px;top:10px;display:flex;gap:6px;z-index:4;max-width:calc(100% - 20px);overflow-x:auto}
#floors button{height:36px;padding:0 13px;border-radius:999px;border:1px solid #d8d5cc;background:#fff;color:#2a313b;font-weight:700;font-size:13px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.06)}
#floors button.on{background:#161b22;color:#fff;border-color:#161b22}
#floors button.on::after{content:' ✎';opacity:.6;font-weight:400}
#hint{position:absolute;left:50%;top:54px;transform:translateX(-50%);background:rgba(22,27,34,.92);color:#e8edf3;padding:8px 14px;border-radius:999px;font-size:13px;max-width:calc(100% - 24px);text-align:center;transition:opacity .4s;pointer-events:none;z-index:4}
#hint.off{opacity:0}
#drawbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(22,27,34,.96);border:1px solid var(--line);border-radius:16px;padding:8px;display:none;flex-direction:column;gap:6px;z-index:5;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:calc(100% - 16px)}
#drawbar.on{display:flex}
#dbinfo{font-size:13px;color:var(--mut);padding:0 4px;font-variant-numeric:tabular-nums}
#dbinfo b{color:var(--txt)}
.dbrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.dbrow input{width:96px;height:44px;text-align:center;font-weight:700}
.dbrow .btn{height:44px;min-width:44px;padding:0 10px}
.ar{font-size:20px;padding:0!important;width:44px}
#zoom{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:3}
#zoom button{width:44px;height:44px;border-radius:12px;border:1px solid #d8d5cc;background:#fff;color:#222;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
#zoom svg{width:22px;height:22px}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:2}
#empty.on{display:flex}
#empty .card{pointer-events:auto;background:#fff;border:1px solid #e4e0d6;border-radius:18px;padding:22px;max-width:420px;color:#1f2733;box-shadow:0 10px 40px rgba(0,0,0,.08);text-align:center}
#empty h2{margin:0 0 6px;font-size:20px}#empty p{margin:0 0 16px;color:#5b6573;font-size:14px}
#empty .btn{width:100%;margin:5px 0;background:#f2f0ea;color:#1f2733;border-color:#e4e0d6;height:48px}
#empty .btn.pri{background:var(--acc);border-color:var(--acc)}
#modal{position:fixed;inset:0;background:rgba(5,8,12,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--bar);border:1px solid var(--line);border-radius:18px;width:100%;max-width:580px;max-height:88vh;overflow:auto;padding:18px;-webkit-user-select:text;user-select:text}
#modal h3{margin:0 0 10px;font-size:19px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{color:var(--mut);font-weight:600;font-size:12px}
.tbl td,.tbl th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl .r{text-align:right}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:8px;background:var(--in);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px}
.pitem.cur{border-color:var(--acc)}
.pitem .nm{flex:1;min-width:0}.pitem .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pitem .nm small{color:var(--mut)}
.menu{display:grid;gap:8px}
.menu .btn{justify-content:flex-start;height:52px;font-size:15px}
.chk{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.chk span{flex:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#222a35;color:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#print{display:none}
.xs{display:none}
#home{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
#home.on{display:flex}
.hh{height:60px;display:flex;align-items:center;gap:8px;padding:0 14px;padding-left:max(14px,env(safe-area-inset-left));background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.hh .logo{font-weight:800;font-size:19px;letter-spacing:.2px;white-space:nowrap}.hh .logo i{color:var(--acc);font-style:normal}
#hcount{color:var(--mut);font-size:13px;margin-left:6px}
.hbar{display:flex;gap:10px 14px;padding:14px 16px 10px;flex-wrap:wrap;align-items:center;flex:none}
.hbar input{max-width:440px;flex:1 1 240px}
#hgrid{flex:1;overflow:auto;padding:6px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;align-content:start;grid-auto-rows:max-content;-webkit-overflow-scrolling:touch}
.pc>*{flex:none}
@media (max-width:560px){#hcount{display:none}#hgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:4px 10px 30px}.pc.new{min-height:0}.pc .ci{padding:8px 2px 10px 10px}.pc .nm small.st{display:none}.hh{gap:4px}}
.pc{background:var(--bar);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;color:var(--txt);transition:border-color .15s,transform .15s}
.pc:hover{border-color:#3a4554}.pc:active{transform:scale(.985)}
.pc .th{aspect-ratio:16/10;background:#fbfaf6;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid var(--line)}
.pc .th svg{width:100%;height:100%;display:block}
.pc .badge{position:absolute;left:10px;top:10px;background:var(--acc);color:#14181d;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.pc .ci{display:flex;align-items:flex-start;gap:4px;padding:10px 6px 12px 13px}
.pc .nm{flex:1;min-width:0}.pc .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;margin-bottom:2px}
.pc .nm small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc .nm small.st{color:#b9c3cf;margin-top:3px}
.pc.new{align-items:center;justify-content:center;border:2px dashed #3a4554;background:transparent;min-height:230px;font-weight:700;color:var(--acc);font-size:16px;gap:6px}
.thE{color:#a39f94;font-size:13px;font-weight:600}
.hempty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 10px}
@media (max-width:760px){
 #app{grid-template-columns:1fr;grid-template-rows:54px 1fr 68px}
 #tools{grid-row:3;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px;overflow-x:auto;padding-bottom:max(6px,env(safe-area-inset-bottom))}
 .tb{min-width:60px}
 #panel{position:fixed;left:0;right:0;bottom:68px;width:auto;max-height:48vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;z-index:20;box-shadow:0 -10px 30px rgba(0,0,0,.3)}
 .hs{display:none!important}
 .xs{display:inline}
 .ib{padding:0 6px;min-width:38px}
 #pname{padding:0 4px;font-size:15px}
 #drawbar{top:10px;bottom:auto}
 #hint{top:auto;bottom:12px}
}
@media print{
 html,body{background:#fff;color:#000;overflow:visible;height:auto}
 #app,#modal,#toast{display:none!important}
 #print{display:block;color:#000;font:11pt Arial,sans-serif}
 @page{size:A4 landscape;margin:9mm}
 .pg{page-break-after:always;break-after:page}
 .pg:last-child{page-break-after:auto;break-after:auto}
 #print svg{width:100%;height:auto;max-height:186mm;display:block}
 #print h2{font-size:15pt;margin:0 0 4mm}
 #print table{border-collapse:collapse;width:100%;margin-bottom:6mm;font-size:10pt}
 #print td,#print th{border-bottom:.3mm solid #999;padding:1.5mm 2mm;text-align:left}
 #print .r{text-align:right}
 #print h3{font-size:12pt;margin:5mm 0 2mm}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="ib" id="bProj" title="Alle Pläne"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span class="hs">Alle Pläne</span></button>
    <div id="pname"></div>
    <button class="ib" id="bUndo" title="Rückgängig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ib" id="bRedo" title="Wiederholen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button class="ib" id="bBg" title="Vorlage / Foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg><span class="hs">Vorlage</span></button>
    <button class="ib" id="bCirc" title="Stromkreise"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span class="hs">Kreise</span></button>
    <button class="ib" id="bCalc" title="Auswertung"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5H6l6 7-6 7h12"/></svg><span class="hs">Material</span></button>
    <button class="ib" id="bExp" title="Export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg><span class="hs">Export</span></button>
    <button class="ib" id="bSet" title="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
  </header>
  <nav id="tools"></nav>
  <main id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg"><g id="bgL"><image id="bgImg" preserveAspectRatio="none" style="display:none"/></g><g id="mainL"></g></svg>
    <div id="floors"></div>
    <div id="hint" class="off"></div>
    <div id="empty"><div class="card">
      <h2>Neuer Plan</h2>
      <p>Zeichne Räume, Leuchten, Steckdosen, Leitungen und Trassen – mit echten Maßen.</p>
      <button class="btn pri" data-e="rect">▭ Raum mit Maßen anlegen</button>
      <button class="btn" data-e="draw">✎ Raum frei zeichnen</button>
      <button class="btn" data-e="bg">📷 Grundriss-Foto als Vorlage</button>
    </div></div>
    <div id="drawbar">
      <div id="dbinfo"></div>
      <div class="dbrow">
        <input id="lenIn" inputmode="decimal" autocomplete="off" placeholder="Länge m">
        <button class="btn ar" data-dir="l">←</button><button class="btn ar" data-dir="u">↑</button><button class="btn ar" data-dir="d">↓</button><button class="btn ar" data-dir="r">→</button>
        <button class="btn" id="dbUndo" title="Letzten Punkt löschen">⟲</button>
        <button class="btn" id="dbRect">▭ Maße</button>
        <button class="btn" id="dbClose">Schließen</button>
        <button class="btn pri" id="dbDone">Fertig</button>
        <button class="btn" id="dbCancel">✕</button>
      </div>
    </div>
    <div id="zoom">
      <button id="zIn" title="Vergrößern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zOut" title="Verkleinern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button id="zFit" title="Alles zeigen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    </div>
  </main>
  <aside id="panel"></aside>
</div>
<div id="home">
  <header class="hh"><div class="logo">Trueline <i>Plan</i></div><span id="hcount"></span><div style="flex:1"></div>
    <button class="ib" id="hImp" title="Projektdatei öffnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 10 5 5 5-5"/><path d="M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg><span class="hs">Datei öffnen</span></button>
    <button class="btn pri" id="hNew"><span class="hs">+ Neuer Plan</span><span class="xs">+ Neu</span></button>
    <button class="ib" id="hClose" title="Zurück zum Plan">✕</button></header>
  <div class="hbar"><input id="hSearch" type="search" placeholder="Suchen: Name, Kunde, Adresse …" autocomplete="off">
    <div class="chips"><button class="chip" data-sort="date">Zuletzt bearbeitet</button><button class="chip" data-sort="name">Name</button><button class="chip" data-sort="kunde">Kunde</button></div></div>
  <div id="hgrid"></div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<div id="print"></div>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>

<script>
'use strict';
/* ================= Helpers ================= */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=(n,d=2)=>(Math.round(n*10**d)/10**d).toFixed(d).replace('.',',');
const fmtIn=v=>(v==null||v===''||isNaN(v))?'':String(Math.round(v*1000)/1000).replace('.',',');
const parseNum=s=>{if(s==null)return NaN;s=String(s).trim().replace(',','.');return s===''?NaN:Number(s)};

 put(p){if(!this.db){memStore[p.id]=clone(p);return Promise.resolve()}return this.req(this.os('readwrite').put(clone(p)))},

/* ================= Wand-Fang für Symbole ================= */
function wallBands(){const r=[];for(const it of plan.items){if(!vis(it))continue;
  if(it.t==='room'){const A=parea(it.pts),th=it.th||0;for(const[a,b]of segs(it))r.push({a,b,lo:A>0?-th:0,hi:A>0?0:th})}
  else if(it.t==='wall'){const th=it.th||0;for(const[a,b]of segs(it))r.push({a,b,lo:-th/2,hi:th/2})}}return r}
function placeSym(kind,w){const S=SYMS[kind]||{};const base={x:w[0],y:w[1],rot:0};if(!S.snap)return base;
 const sz=isOpening(kind)?(S.w||1):settings.symSize;let best=null,bd=Math.max(.6,36/view.s);
 for(const b of wallBands()){const dx=b.b[0]-b.a[0],dy=b.b[1]-b.a[1],L=Math.hypot(dx,dy);if(L<1e-6)continue;const ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
  const t=(w[0]-b.a[0])*ux+(w[1]-b.a[1])*uy;if(t<-.05||t>L+.05)continue;const sd=(w[0]-b.a[0])*nx+(w[1]-b.a[1])*ny;
  const mid=(b.lo+b.hi)/2;const face=sd<mid?b.lo:b.hi;const dd=Math.abs(sd-face);
  if(S.snap==='in'?Math.abs(sd-mid)<bd:dd<bd){bd=S.snap==='in'?Math.abs(sd-mid):dd;best={b,ux,uy,nx,ny,t:clamp(t,0,L),sd,mid,face,L}}}
 if(!best)return base;const{b,ux,uy,nx,ny,t,sd,mid,face}=best;const px=b.a[0]+ux*t,py=b.a[1]+uy*t;
 if(S.snap==='in'){const rot=Math.atan2(uy,ux)*180/Math.PI;return{x:px+nx*mid,y:py+ny*mid,rot:Math.round(rot*100)/100,fy:sd>mid,t2:b.hi-b.lo}}
 const side=sd<mid?-1:1;const off=face+side*sz/2;const tx=-side*nx,ty=-side*ny;const rot=Math.atan2(-tx,ty)*180/Math.PI;
 return{x:px+nx*off,y:py+ny*off,rot:Math.round(rot*100)/100}}

/* ================= Fang ================= */
function outerCorners(it){const p=it.pts,n=p.length,A=parea(p),th=it.th||0,r=[];if(!th||n<3)return r;
 for(let i=0;i<n;i++){const a=p[(i-1+n)%n],b=p[i],c=p[(i+1)%n];const n1=nrm(a,b),n2=nrm(b,c);const sg=A>0?-1:1;const m=1+n1[0]*n2[0]+n1[1]*n2[1];if(m<.05)continue;
  r.push([b[0]+sg*th*(n1[0]+n2[0])/m,b[1]+sg*th*(n1[1]+n2[1])/m])}return r}
function nrm(a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;return[-dy/L,dx/L]}
function snapPts(it){if(it.t==='sym')return[connPt(it)];if(!it.pts)return[];if(it.t==='room')return it.pts.concat(outerCorners(it));return it.pts}
function snapPoint(raw,prev,ex){const tol=18/view.s;let best=null,bd=tol;const gf=ghostFl();
 for(const it of plan.items){if(it===ex||!(vis(it)||(gf&&it.fl===gf&&(it.t==='room'||it.t==='wall'))))continue;for(const q of snapPts(it)){const d=dist(raw,q);if(d<bd){bd=d;best=q}}}
 if(draft&&draft.pts.length>2&&dist(raw,draft.pts[0])<tol)return{p:draft.pts[0].slice(),k:'pt'};
 if(best)return{p:[best[0],best[1]],k:'pt'};

async function svgCanvas(svg,w,h,maxSide){const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('Bild konnte nicht erzeugt werden'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
 const sc=Math.min(maxSide/Math.max(w,h),Math.sqrt(16e6/(w*h)));const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);return c}
async function canvasJpeg(c){const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));return new Uint8Array(await b.arrayBuffer())}
function pdfBuild(pages){const enc=new TextEncoder(),chunks=[],offs=[];let len=0;const push=x=>{const b=typeof x==='string'?enc.encode(x):x;chunks.push(b);len+=b.length};
 const obj=(id,fn)=>{offs[id]=len;push(id+' 0 obj\n');fn();push('\nendobj\n')};
 push('%PDF-1.4\n%âãÏÓ\n');const n=pages.length;
 obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
 obj(2,()=>push(`<< /Type /Pages /Kids [${pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')}] /Count ${n} >>`));
 pages.forEach((p,i)=>{const pid=3+3*i,cid=pid+1,iid=pid+2,m=p.m??18;const sc=Math.min((p.pw-2*m)/p.w,(p.ph-2*m)/p.h),dw=p.w*sc,dh=p.h*sc,x=(p.pw-dw)/2,y=p.top?p.ph-m-dh:(p.ph-dh)/2;
  const cs=`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`;
  obj(pid,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${p.pw.toFixed(2)} ${p.ph.toFixed(2)}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
  obj(cid,()=>{push(`<< /Length ${cs.length} >>\nstream\n`);push(cs);push('\nendstream')});
  obj(iid,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${p.px} /Height ${p.py} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.data.length} >>\nstream\n`);push(p.data);push('\nendstream')})});
 const xref=len,total=3+3*n;push(`xref\n0 ${total}\n0000000000 65535 f \n`);for(let i=1;i<total;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
 push(`trailer\n<< /Size ${total} /Root 1 0 R /Info << /Producer (Trueline Plan) >> >>\nstartxref\n${xref}\n%%EOF`);return new Blob(chunks,{type:'application/pdf'})}
function materialSVGs(){const r=calc(),res=settings.reserve||0,PW=794,PH=1123,M=52,rows=[],n=(x,d=1)=>fmt(x,d);
 const C5=[[M,'start'],[455,'end'],[545,'end'],[630,'end'],[PW-M,'end']],C3=[[M,'start'],[570,'end'],[PW-M,'end']],C2=[[M,'start'],[PW-M,'end']];
 const CR=assignCircuits(),crow=circRowsSorted(CR);if(crow.length){const C6=[[M,'start'],[M+70,'start'],[445,'start'],[515,'start'],[575,'start'],[PW-M,'end']],tr=(x,l)=>x.length>l?x.slice(0,l-1)+'…':x;
  rows.push({k:'h',t:'Stromkreise'},{k:'th',cols:C6,c:['Kreis','Bezeichnung','Absich.','FI/RCD','Leitung','Länge']});
  crow.forEach(C=>{const m=(plan.cmeta||{})[circKey(C)]||{};rows.push({k:'tr',cols:C6,c:[circId(C,CR),tr(circName(C),46),m.fuse||(fuseSuggest(C)?fuseSuggest(C)+'*':''),m.rcd||'',tr(C.ctypes,20),n(C.len)+' m'],b:0})});
  if(crow.some(C=>!((plan.cmeta||{})[circKey(C)]||{}).fuse&&fuseSuggest(C)))rows.push({k:'p',t:'* Vorschlag nach Querschnitt – Verlegeart, Häufung und Leitungslänge prüfen.'})}
 const ck=Object.keys(r.cables);if(ck.length){rows.push({k:'h',t:'Leitungen'},{k:'th',cols:C5,c:['Typ','Plan','Zuschlag','+'+fmtIn(res)+' %','Bedarf']});ck.forEach(k=>{const c=r.cables[k],t=(c.len+c.extra)*(1+res/100);rows.push({k:'tr',cols:C5,dot:cableColor(k),c:[k+'  ('+c.n+'×)',n(c.len)+' m',n(c.extra)+' m',n(t)+' m',Math.ceil(t)+' m'],b:4})})}
 const tk=Object.keys(r.trays);if(tk.length){rows.push({k:'h',t:'Trassen / Kanäle / Rohre'},{k:'th',cols:C3,c:['Typ','Länge','Stück']});tk.forEach(k=>{const c=r.trays[k];rows.push({k:'tr',cols:C3,dot:trayColor(k),c:[k,n(c.len)+' m',c.pl?Math.ceil(c.len/c.pl-1e-9)+' × '+c.pl+' m':'–'],b:1})})}
 const sk=Object.keys(r.syms);if(sk.length){rows.push({k:'h',t:'Betriebsmittel'},{k:'th',cols:C2,c:['Symbol','Anzahl']});sk.forEach(k=>rows.push({k:'tr',cols:C2,c:[SYMS[k].n.replace(/­/g,''),String(r.syms[k])],b:1}))}
 if(r.rooms.length){rows.push({k:'h',t:'Räume'},{k:'th',cols:C3,c:['Raum','Fläche','Umfang']});r.rooms.forEach(x=>rows.push({k:'tr',cols:C3,c:[x.name||'Raum',n(x.a,2)+' m²',n(x.u,2)+' m']}));rows.push({k:'tr',cols:C3,c:['Summe',n(r.rooms.reduce((s,x)=>s+x.a,0),2)+' m²',''],b:1,bold:true})}
 if(plan.meta&&plan.meta.notiz){rows.push({k:'h',t:'Notizen'});for(const para of plan.meta.notiz.split('\n')){let line='';for(const w of para.split(' ')){if((line+' '+w).length>92){rows.push({k:'p',t:line});line=w}else line=line?line+' '+w:w}rows.push({k:'p',t:line})}}
 if(!rows.length)rows.push({k:'p',t:'Noch keine Elemente im Plan.'});
 const RH={h:44,th:26,tr:26,p:19},pages=[];let cur=[],y=0;const top=i=>i===0?170:100,bottom=PH-70;
 rows.forEach(row=>{if(!pages.length&&!cur.length)y=top(0);let need=RH[row.k]+(row.k==='h'?RH.th+RH.tr:0);if(y+need>bottom&&cur.length){pages.push(cur);cur=[];y=top(1)}cur.push([row,y]);y+=RH[row.k]});if(cur.length)pages.push(cur);
 const T=(x,y,t,o='')=>`<text x="${x}" y="${y}" ${o}>${esc(t)}</text>`;const date=new Date().toLocaleDateString('de-DE');
 return pages.map((pg,pi)=>{let o=`<svg xmlns="http://www.w3.org/2000/svg" width="${PW}" height="${PH}" viewBox="0 0 ${PW} ${PH}" font-family="Arial,Helvetica,sans-serif"><rect width="100%" height="100%" fill="#fff"/>`;
  if(pi===0){o+=T(M,78,'Materialauszug','font-size="13" fill="#777" font-weight="700"')+T(M,110,plan.name,'font-size="26" font-weight="800" fill="#111"')+T(M,136,[plan.meta.kunde,plan.meta.adresse].filter(Boolean).join(' · '),'font-size="13" fill="#444"')+T(PW-M,78,date,'font-size="13" fill="#444" text-anchor="end"')+`<line x1="${M}" y1="150" x2="${PW-M}" y2="150" stroke="#111" stroke-width="1.5"/>`}
  else o+=T(M,64,plan.name+' – Materialauszug (Fortsetzung)','font-size="13" fill="#777" font-weight="700"');
  for(const[row,y]of pg){if(row.k==='h')o+=T(M,y+30,row.t,'font-size="16" font-weight="800" fill="#111"');
   else if(row.k==='p')o+=T(M,y+14,row.t,'font-size="12.5" fill="#222"');
   else{const th=row.k==='th';row.c.forEach((t,i)=>{const[x,a]=row.cols[i];const dx=i===0&&row.dot?16:0;o+=T(x+dx,y+17,t,`font-size="${th?11.5:13}" text-anchor="${a}" fill="${th?'#777':'#111'}"${(th||(row.bold)||(row.b===i&&i>0))?' font-weight="700"':''}`)});
    if(row.dot)o+=`<circle cx="${M+5}" cy="${y+13}" r="5" fill="${row.dot}"/>`;o+=`<line x1="${M}" y1="${y+RH[row.k]-.5}" x2="${PW-M}" y2="${y+RH[row.k]-.5}" stroke="${th?'#999':'#ddd'}"/>`}}
  o+=T(M,PH-34,'Reserve auf Leitungen: '+fmtIn(res)+' % · Längen aus dem Plan ohne Gewähr','font-size="10" fill="#999"')+T(PW-M,PH-34,'Seite '+(pi+1)+' / '+pages.length+' · Trueline Plan','font-size="10" fill="#999" text-anchor="end"');
  return o+'</svg>'})}
async function exportPdf(p){const keep=plan;const exs=[];let mats=null;plan=ensureFloors(p);const fl0=plan.curFl;
 try{for(const f of plan.floors){plan.curFl=f.id;const bb=contentBBox(!!(plan.bg&&plan.bg.exp));if(!bb)continue;const land=(bb.x1-bb.x0)>=(bb.y1-bb.y0)*.8;
   const ex=buildExport(land?{W:1200,fitH:Math.round(1200*595.28/841.89)}:{W:900,fitH:Math.round(900*841.89/595.28)});if(ex)exs.push([ex,land])}
  plan.curFl=fl0;if(exs.length)mats=materialSVGs()}finally{plan.curFl=fl0;plan=keep}if(!exs.length){toast('Der Plan ist noch leer');return}
 const pages=[];const A4L=[841.89,595.28],A4P=[595.28,841.89];
 for(const[ex,land]of exs){const c=await svgCanvas(ex.svg,ex.w,ex.h,3300);pages.push({data:await canvasJpeg(c),px:c.width,py:c.height,w:ex.w,h:ex.h,pw:(land?A4L:A4P)[0],ph:(land?A4L:A4P)[1]})}
 for(const sv of mats){const c2=await svgCanvas(sv,794,1123,2480);pages.push({data:await canvasJpeg(c2),px:c2.width,py:c2.height,w:794,h:1123,pw:A4P[0],ph:A4P[1],m:0})}
 shareOrDownload(pdfBuild(pages),fname('pdf',p.name),true)}

 try{const bb=contentBBox(false);if(!bb)out='<div class="thE">Noch leer</div>';else{const TW=320,TH=200,m=.5,bw=bb.x1-bb.x0+2*m,bh=bb.y1-bb.y0+2*m,s=Math.min(TW/bw,TH/bh);

 mbox.querySelectorAll('[data-s]').forEach(el=>el.onchange=()=>{const k=el.dataset.s,v=el.type==='checkbox'?el.checked:+el.value;if(k.startsWith('lay.'))settings.lay[k.slice(4)]=v;else settings[k]=v;saveSettings();if(k.startsWith('lay.')&&sel&&!vis(byId(sel)||{}))sel=null;renderPanel();render()})}

let toastT=null;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2600)}
function updTop(){$('#bUndo').disabled=!hist.u.length&&!(draft&&draft.pts.length);$('#bRedo').disabled=!hist.r.length}
function updName(){$('#pname').innerHTML=esc(plan.name)+(plan.meta&&plan.meta.kunde?`<small>${esc(plan.meta.kunde)}</small>`:'')}
let emptyTmp=false;function updEmpty(){$('#empty').classList.toggle('on',!plan.items.length&&!plan.bg&&!emptyTmp)}
function hideEmptyTmp(){if(!emptyTmp&&$('#empty').classList.contains('on')){emptyTmp=true;updEmpty()}}
$('#empty').addEventListener('click',e=>{const b=e.target.closest('[data-e]');if(!b)return;emptyTmp=true;updEmpty();const a=b.dataset.e;if(a==='rect')roomRectDialog();else if(a==='draw')setTool('room');else bgDialog()});
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;$('#bProj').onclick=openHome;$('#pname').onclick=()=>infoDialog(plan.id);$('#bBg').onclick=bgDialog;$('#bCalc').onclick=calcDialog;$('#bCirc').onclick=circDialog;$('#bExp').onclick=exportDialog;$('#bSet').onclick=setDialog;
$('#zIn').onclick=()=>zoomAt(W/2,H/2,1.35);$('#zOut').onclick=()=>zoomAt(W/2,H/2,1/1.35);$('#zFit').onclick=fitView;
window.addEventListener('keydown',e=>{if(modal.classList.contains('on')){if(e.key==='Escape')closeModal();return}if(home.classList.contains('on')){if(e.key==='Escape'&&plan.saved)closeHome();return}if(e.target.matches('input,textarea,select'))return;const k=e.key.toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo();return}
 if(e.key==='Escape'){if(draft)cancelDraft();else if(sel){sel=null;renderPanel();render()}else setTool('sel');return}
 if(e.key==='Enter'&&draft){finishDraft(draft.t==='room');return}
 if((e.key==='Delete'||e.key==='Backspace')&&sel){plan.items=plan.items.filter(x=>x.id!==sel);sel=null;commit();renderPanel();return}
 const map={v:'sel',r:'room',w:'wall',s:'sym',l:'cable',t:'tray',m:'dim',x:'text'};if(!e.ctrlKey&&!e.metaKey&&map[k])setTool(map[k]);
 if(/^[0-9]$/.test(e.key)&&draft){lenIn.focus()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
window.addEventListener('pagehide',()=>saveNow());
document.addEventListener('gesturestart',e=>e.preventDefault());
if(!inClaude){window.addEventListener('popstate',()=>{if(modal.classList.contains('on')){closeModal();try{history.pushState({v:'edit'},'')}catch(e){}return}if(!home.classList.contains('on'))openHome()});
 if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}

(async function init(){await Store.open();let id=null;try{id=localStorage.getItem('tlp.last')}catch(e){}
 let p=id?await Store.get(id).catch(()=>null):null;if(!p){const all=await Store.all().catch(()=>[]);if(all.length)p=all.sort((a,b)=>b.updated-a.updated)[0]}
 if(p){plan=ensureFloors(p);plan.meta=plan.meta||{kunde:'',adresse:'',notiz:''};plan.saved=true}else plan=newPlan('Mein erster Plan')
 resetHist();updName();renderFloors();resize();setTool('sel');requestAnimationFrame(()=>{resize();if(plan.items.length||plan.bg)fitView();else{view.s=60;view.ox=W/2-120;view.oy=H/2-90;render()}updEmpty();openHome()})})();
</script>
